name: Health & Safety refresh (self-hosted)

on:
  schedule:
    # 10 past the hour (offset from the main 05-past refresh) so the two
    # workflows don't race to commit at the same moment.
    - cron: '10 8,12,15 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: health-safety-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Needs a runner inside the company network with a route to SQL-ROTO-02 -
    # GitHub's own cloud runners have no path to it. See README/RUNBOOK for
    # how this runner is set up.
    runs-on: self-hosted
    # Force the built-in Windows PowerShell 5.1 (a real system binary at a
    # fixed path) rather than `pwsh`, which on this runner resolves to a
    # Microsoft Store "app execution alias" stub that fails to launch
    # ("Access is denied") outside a full interactive logon session.
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Make sure git is on PATH for later steps
        # actions/checkout doesn't need a PATH-resolved git.exe, but our own
        # steps below do - and this runner's background-service environment
        # doesn't carry the interactive user's PATH. $GITHUB_PATH is the
        # officially supported way to extend PATH for the rest of this job,
        # without touching the machine's own PATH or the runner service.
        run: |
          $existing = Get-Command git -ErrorAction SilentlyContinue
          if ($existing) {
            Write-Host "git already on PATH: $($existing.Source)"
          } else {
            $candidates = @(
              "$env:ProgramFiles\Git\cmd",
              "$env:ProgramFiles\Git\bin",
              "${env:ProgramFiles(x86)}\Git\cmd",
              # $env:LOCALAPPDATA is account-relative, and the runner service
              # runs as a different Windows account than the interactive user
              # - so a per-user Git install needs its real, absolute path,
              # not a templated guess that only resolves for one account.
              "C:\Users\jbell\AppData\Local\Programs\Git\cmd"
            )
            $found = $candidates | Where-Object { Test-Path "$_\git.exe" } | Select-Object -First 1
            if (-not $found) {
              Write-Error "Could not find git.exe in any known install location."
              exit 1
            }
            Add-Content -Path $env:GITHUB_PATH -Value $found
            Write-Host "Added $found to PATH for the rest of this job"
          }

      - name: Fetch latest Health & Safety figures from SQL-ROTO-02
        env:
          HS_DB_SERVER: ${{ secrets.HS_DB_SERVER }}
          HS_DB_NAME: ${{ secrets.HS_DB_NAME }}
          HS_DB_USER: ${{ secrets.HS_DB_USER }}
          HS_DB_PASSWORD: ${{ secrets.HS_DB_PASSWORD }}
          HS_DB_DOMAIN: ${{ secrets.HS_DB_DOMAIN }}
        run: |
          npm install mssql@12.8.1 --no-save
          node scripts/fetch_health_safety.mjs

      - name: Commit and push if changed
        run: |
          git diff --quiet -- index.html
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No changes"
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Health & Safety refresh"
            git pull --rebase origin main
            git push
          }

name: Bulletin refresh (8:05, 12:05, 15:05 UK)

on:
  schedule:
    # 08:05, 12:05 and 15:05 UTC. A few minutes past the hour, not on it,
    # since GitHub's scheduler is most congested (and most likely to delay
    # runs) right at :00. UK is UTC+0 in winter (GMT) and UTC+1 in summer
    # (BST), so during BST this lands ~1 hour later local time.
    - cron: '5 8,12,15 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hourly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update timestamp and live Claude status
        run: python3 scripts/update_status.py

      - name: Refresh fraud/AI/Claude content via Claude API
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/update_content.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Bulletin refresh"
            git push
          fi

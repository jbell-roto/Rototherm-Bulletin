name: Bulletin refresh (hourly, :10 past)

on:
  schedule:
    # 10 past every hour, not on the dot, since GitHub's scheduler is most
    # congested (and most likely to delay runs) right at :00.
    - cron: '10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hourly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update timestamp and live Claude status
        run: python3 scripts/update_status.py

      - name: Refresh fraud/AI content via Claude API
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/update_content.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Bulletin refresh"
            git pull --rebase origin main
            git push
          fi

<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="1800">
<title>Rototherm Info Bulletin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Same dark TV-signage palette as the live bulletin — this is a preview of that page, not a new design */
  :root{
    --bg:#0b1220; --panel:#111a2e; --panel2:#16213a; --line:#22304d;
    --text:#e8edf6; --muted:#9aa8c2; --dim:#6b7a96;
    --ok:#22c55e; --minor:#f5b014; --major:#ef4444; --info:#60a5fa; --violet:#a78bfa;
    color-scheme: dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
  html,body{height:100%;overflow:hidden;cursor:none}
  body{display:grid;grid-template-rows:auto auto 1fr auto;height:100vh;gap:.8vw;padding-block:1vw 0;padding-left:max(16px,1.6vw,env(safe-area-inset-left,0px));padding-right:max(16px,1.6vw,env(safe-area-inset-right,0px))}
  header{display:flex;align-items:center;justify-content:space-between;gap:1vw}
  .brand{display:flex;align-items:center;gap:1vw}
  h1{font-size:1.8vw;font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:0.857vw;margin-top:.15vw}
  .clock{text-align:right}
  .time{font-size:2.35vw;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .date{color:var(--muted);font-size:0.902vw}
  .logo-img{width:4.6vw;height:4.6vw;object-fit:contain;display:block}


  .alert{display:flex;align-items:center;gap:1.2vw;background:linear-gradient(90deg,rgba(239,68,68,.22),rgba(239,68,68,.06));border:1px solid rgba(239,68,68,.55);border-radius:.8vw;padding:.6vw 1.3vw}
  .alert.hidden{display:none}
  .alert .tag{background:var(--major);color:#fff;font-weight:800;font-size:0.812vw;padding:.35vw .7vw;border-radius:.4vw;letter-spacing:.06em;white-space:nowrap;animation:pulse 2s infinite}
  .alert .msg{font-size:1.53vw;font-weight:600;line-height:1.35}
  .alert .msg span{color:#fca5a5;font-weight:500}
  @keyframes pulse{50%{opacity:.55}}
  main{display:grid;grid-template-columns:1.05fr 1fr 1.2fr;grid-template-rows:1.15fr .85fr;gap:1vw;min-height:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:1vw;padding:1.1vw 1.3vw;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .card h2{display:flex;align-items:center;gap:.6vw;font-size:1.35vw;font-weight:700;margin-bottom:.8vw;text-transform:uppercase;letter-spacing:.05em}
  .card h2 .dot{width:.75vw;height:.75vw;border-radius:50%}
  .status{grid-column:1;grid-row:2}
  .upcoming{grid-column:2;grid-row:1}
  .fraud{grid-column:3;grid-row:1 / span 2}
  .ai-card{grid-column:2;grid-row:2}
  .hs-card{grid-column:1;grid-row:1}
  .hs-headline{display:flex;align-items:center;gap:.7vw;margin-bottom:.7vw}
  .hs-headline .n{font-size:2vw;font-weight:800;color:var(--text);line-height:1}
  .hs-headline .lbl{font-size:0.95vw;color:var(--muted)}
  .hs-headline .record{margin-left:auto;font-size:0.76vw;color:#fde68a;background:rgba(253,230,138,.14);padding:.2vw .6vw;border-radius:1vw;font-weight:700;white-space:nowrap}
  .hs-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6vw}
  .hs-tile{display:flex;align-items:center;gap:.6vw;background:var(--panel2);border-radius:.7vw;padding:.6vw .7vw}
  .hs-icon{flex:none;width:2.3vw;height:2.3vw;border-radius:50%;display:grid;place-items:center}
  .hs-icon.lg{width:2.9vw;height:2.9vw}
  .hs-tile-text{min-width:0}
  .hs-tile b{display:block;font-size:1.6vw;font-weight:800;line-height:1.1}
  .hs-tile .lbl{display:block;font-size:0.78vw;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:.1vw}
  .hs-tile .d{display:block;font-size:0.78vw;font-weight:700;margin-top:.1vw}
  .hs-tile .d.good{color:var(--ok)}
  .hs-tile .d.bad{color:#f87171}
  .hs-tile .d.neutral{color:var(--muted)}
  .upcoming .u-list{margin-bottom:.6vw}
  .upcoming .u-row{display:flex;align-items:baseline;gap:.6vw;padding:.55vw 0;border-bottom:1px solid var(--line)}
  .upcoming .u-row:last-child{border-bottom:none}
  .upcoming .u-date{flex:none;font-size:0.857vw;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;min-width:4.4vw}
  .upcoming .u-name{font-weight:700;font-size:1.49vw;line-height:1.3}
  .upcoming .u-tag{font-size:0.7vw;font-weight:700;color:#93c5fd;background:rgba(96,165,250,.18);padding:.12vw .5vw;border-radius:1vw;margin-left:.4vw;vertical-align:middle}
  .upcoming h3{font-size:0.857vw;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin:.7vw 0 .3vw}
  .upcoming .u-empty{color:var(--muted);font-size:1.1vw}
  .scroll{flex:1;min-height:0;overflow:hidden;position:relative}
  .scroll.no-autoscroll{mask-image:linear-gradient(180deg,#000 88%,transparent)}
  .scroll-inner{will-change:transform}
  .svc{display:flex;align-items:flex-start;gap:.8vw;padding:.8vw 0;border-bottom:1px solid var(--line)}
  .svc:last-child{border-bottom:none}
  .light{flex:none;width:1.2vw;height:1.2vw;border-radius:50%;margin-top:.45vw;margin-left:.3vw}
  .light.ok{background:var(--ok);box-shadow:0 0 .8vw rgba(34,197,94,.6)}
  .light.minor{background:var(--minor);box-shadow:0 0 .8vw rgba(245,176,20,.6)}
  .light.major{background:var(--major);box-shadow:0 0 .8vw rgba(239,68,68,.7);animation:pulse 1.6s infinite}
  .svc-name{font-weight:700;font-size:1.49vw}
  .svc-state{font-size:0.902vw;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-left:.4vw}
  .svc-state.ok{color:var(--ok)} .svc-state.minor{color:var(--minor)} .svc-state.major{color:#f87171}
  .svc-note{color:var(--muted);font-size:1.17vw;line-height:1.35;margin-top:.15vw}
  .allclear{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;flex:1;gap:.6vw;color:var(--muted)}
  .allclear .tick{width:3.4vw;height:3.4vw;border-radius:50%;background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.5);display:grid;place-items:center;font-size:1.8vw;color:var(--ok)}
  .allclear .headline{font-size:1.35vw;font-weight:800;color:var(--text)}
  .allclear .sub2{font-size:0.95vw}
  .item{padding:.9vw 0;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:none}
  .item-top{display:flex;align-items:baseline;gap:.6vw}
  .when{flex:none;font-size:0.857vw;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;min-width:4.4vw}
  .item-title{font-weight:700;font-size:1.49vw;line-height:1.3}
  .item-body{color:var(--muted);font-size:1.22vw;line-height:1.4;margin-top:.25vw;padding-left:5vw}
  .pill{display:inline-block;font-size:0.767vw;font-weight:700;padding:.12vw .5vw;border-radius:1vw;margin-left:.4vw;vertical-align:middle}
  .pill.hot{background:rgba(239,68,68,.2);color:#fca5a5}
  .pill.new{background:rgba(96,165,250,.2);color:#93c5fd}
  .pill.rel{background:rgba(167,139,250,.22);color:#c4b5fd}
  .rules{display:grid;grid-template-columns:1fr 1fr;gap:.6vw;margin-top:.8vw}
  .rule{background:var(--panel2);border-radius:.7vw;padding:.7vw .9vw}
  .rule b{display:block;font-size:1.71vw;font-weight:800;color:#fde68a}
  .rule span{font-size:0.947vw;color:var(--muted);line-height:1.3;display:block;margin-top:.1vw}
  footer{display:flex;align-items:center;gap:1vw;height:4vw;border-top:1px solid var(--line);padding:0 1.6vw;margin:0 -1.6vw;background:#0e1628;overflow:hidden}
  .tick-label{flex:none;font-weight:800;font-size:1.04vw;color:#fde68a;letter-spacing:.06em}
  .ticker{flex:1;overflow:hidden;white-space:nowrap;mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
  .ticker-track{display:inline-block;padding-left:100%;animation:tick 110s linear infinite;font-size:1.31vw;color:var(--text)}
  .ticker-track span{margin-right:4vw}
  .ticker-track span::before{content:"●";color:var(--minor);margin-right:.8vw;font-size:0.632vw;vertical-align:middle}
  @keyframes tick{to{transform:translateX(-100%)}}
  .updated{flex:none;font-size:0.857vw;color:var(--dim)}
  .src{font-size:0.857vw;color:var(--dim);margin-top:.5vw}

  .seasonal-layer{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:40}
  .particle{position:absolute;top:-8vh;line-height:1;animation-name:seasonal-fall;animation-timing-function:linear;animation-fill-mode:forwards;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
  @keyframes seasonal-fall{
    0%{transform:translate(0,-10vh) rotate(0deg);opacity:0}
    8%{opacity:.9}
    30%{transform:translate(var(--dx1),28vh) rotate(90deg)}
    60%{transform:translate(var(--dx2),62vh) rotate(200deg)}
    85%{transform:translate(var(--dx1),88vh) rotate(300deg)}
    100%{transform:translate(0,112vh) rotate(380deg);opacity:.7}
  }
</style>
</head>

<script>
const D = JSON.parse(document.getElementById('bulletin-data').textContent);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pill = t => t==='hot' ? '<span class="pill hot">ALERT</span>' : t==='new' ? '<span class="pill new">NEW</span>' : t==='rel' ? '<span class="pill rel">RELEVANT TO US</span>' : '';
const items = arr => arr.map(i => `<div class="item"><div class="item-top"><span class="when">${esc(i.when)}</span><span class="item-title">${esc(i.title)}${pill(i.tag)}</span></div><div class="item-body">${esc(i.body)}</div></div>`).join('');

const todayISO = new Date().toLocaleDateString('en-CA', {timeZone: 'Europe/London'});

// Alert banner — an optional "until" (YYYY-MM-DD) auto-hides it after that
// date, so a one-off notice like "jumper day" doesn't need a manual takedown.
const al = document.getElementById('alert');
if (D.alert && D.alert.show && (!D.alert.until || todayISO <= D.alert.until)) {
  document.getElementById('alertTag').textContent = D.alert.tag;
  document.getElementById('alertMsg').innerHTML = esc(D.alert.text) + (D.alert.detail ? `<br><span>${esc(D.alert.detail)}</span>` : '');
} else al.classList.add('hidden');

// Service status — only render rows that aren't "ok"; show an all-clear state otherwise
function renderServices(list){
  const down = list.filter(s => s.state !== 'ok');
  const el = document.getElementById('services');
  if (down.length === 0){
    el.innerHTML = `<div class="allclear"><div class="tick">&#10003;</div><div class="headline">All systems operational</div><div class="sub2">${list.length} services monitored — nothing to report</div></div>`;
  } else {
    el.innerHTML = down.map(s =>
      `<div class="svc"><i class="light ${s.state}"></i><div><div><span class="svc-name">${esc(s.name)}</span><span class="svc-state ${s.state}">${esc(s.label)}</span></div><div class="svc-note">${esc(s.note)}</div></div></div>`).join('');
  }
}
renderServices(D.services);

document.getElementById('statusSrc').textContent = D.statusSource;
document.getElementById('fraud').innerHTML = items(D.fraud.slice(0, 3));
document.getElementById('ai').innerHTML = items(D.ai.slice(0, 3));

// Health & Safety — live figures from RotoCentral. More near misses reported isn't
// shown as worse (reporting them is the point); minor/lost-time/RIDDOR are, fewer is good.
function hsDelta(now, before, neutral){
  if (before == null) return { text: 'No earlier data', cls: 'neutral' };
  const diff = now - before;
  if (diff === 0) return { text: 'No change', cls: 'neutral' };
  const dir = diff > 0 ? 'up' : 'down';
  const pct = before === 0 ? null : Math.round((Math.abs(diff) / before) * 100);
  const words = `${pct == null ? Math.abs(diff) : pct + '%'} ${dir === 'up' ? 'more' : 'fewer'}`;
  return { text: words, cls: neutral ? 'neutral' : (dir === 'down' ? 'good' : 'bad') };
}
// Clean line-icon SVGs (lucide-style: 24x24, stroke only) so every badge matches in
// weight and colour, instead of relying on emoji glyphs that bring their own styling.
const HS_ICON_SHAPES = {
  check: '<path d="M20 6 9 17l-5-5"/>',
  warning: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  cross: '<path d="M12 5v14"/><path d="M5 12h14"/>',
  timer: '<path d="M10 2h4"/><path d="m12 14 3-3"/><circle cx="12" cy="14" r="8"/>',
  shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M12 8v4"/><path d="M12 16h.01"/>',
};
// Same soft badge the Service status "all clear" tick uses: a translucent tint of the
// colour behind a matching ring, with the icon itself drawn in that colour — not a
// solid-filled circle, so every badge on the board reads as one family.
const hsIcon = (shape, size, rgb) =>
  `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="rgb(${rgb})" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">${HS_ICON_SHAPES[shape]}</svg>`;
const hsBadge = (shape, size, rgb) =>
  `<span class="hs-icon${size === 'lg' ? ' lg' : ''}" style="background:rgba(${rgb},.15);border:1px solid rgba(${rgb},.5)">${hsIcon(shape, size === 'lg' ? 22 : 18, rgb)}</span>`;

function hsTile(label, now, before, neutral, shape, rgb){
  const d = hsDelta(now, before, neutral);
  return `<div class="hs-tile">${hsBadge(shape, 'sm', rgb)}` +
    `<div class="hs-tile-text"><b>${now}</b><span class="lbl">${esc(label)}</span><span class="d ${d.cls}">${d.text}</span></div></div>`;
}
const hs = D.healthSafety;
document.getElementById('hs').innerHTML =
  `<div class="hs-headline">${hsBadge('check', 'lg', '34,197,94')}` +
  `<span class="n">${hs.daysSinceIncident}</span><span class="lbl">days without incident</span>${hs.record ? `<span class="record">Record ${hs.record}</span>` : ''}</div>` +
  `<div class="hs-grid">` +
    hsTile('Near misses', hs.nearMisses.now, hs.nearMisses.before, true, 'warning', '245,176,20') +
    hsTile('Minor accidents', hs.minorAccidents.now, hs.minorAccidents.before, false, 'cross', '249,115,22') +
    hsTile('Lost time', hs.lostTimeAccidents.now, hs.lostTimeAccidents.before, false, 'timer', '244,63,94') +
    hsTile('RIDDOR', hs.riddor.now, hs.riddor.before, false, 'shield', '167,139,250') +
  `</div>`;

document.getElementById('rules').innerHTML = D.rules.map(r => `<div class="rule"><b style="${r.small?'font-size:1.13vw;padding:.3vw 0':''}">${esc(r.big)}</b><span>${esc(r.text)}</span></div>`).join('');
document.getElementById('ticker').innerHTML = D.ticker.map(t => `<span>${esc(t)}</span>`).join('');
document.getElementById('updated').textContent = 'Updated ' + D.updated;

// Upcoming in Rototherm — auto-advances: picks the next 2 rota dates from
// today (UK time), so this never needs a manual weekly update.
const nextHosts = (D.rota || []).filter(r => r.date >= todayISO).slice(0, 2);
const hostsHtml = nextHosts.length
  ? nextHosts.map(h => {
      const label = new Date(h.date + 'T00:00:00').toLocaleDateString('en-GB', {day:'numeric', month:'short'});
      const isToday = h.date === todayISO;
      return `<div class="u-row"><span class="u-date">${esc(label)}</span><span class="u-name">${esc(h.name)}${isToday ? '<span class="u-tag">Today</span>' : ''}</span></div>`;
    }).join('')
  : '<div class="u-empty">Rota needs new dates added</div>';
const nextVisitors = (D.visitorsAll || []).filter(v => v.date >= todayISO).slice(0, 3);
const visitorsHtml = nextVisitors.length
  ? nextVisitors.map(v => {
      const label = new Date(v.date + 'T00:00:00').toLocaleDateString('en-GB', {day:'numeric', month:'short'});
      return `<div class="u-row"><span class="u-date">${esc(label)}</span><span class="u-name">${esc(v.name)}</span></div>`;
    }).join('')
  : '<div class="u-empty">No visitors scheduled</div>';
document.getElementById('upcoming').innerHTML =
  `<div class="u-list">${hostsHtml}</div><h3>Visitors / events</h3>${visitorsHtml}`;

// Clock (UK time)
function tick(){
  const n = new Date();
  document.getElementById('time').textContent = n.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/London'});
  document.getElementById('date').textContent = n.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'Europe/London'});
}
tick(); setInterval(tick, 10000);

// Seasonal flourish — a burst of themed particles once an hour (UK time),
// so the board stays quiet most of the time and doesn't distract from the content.
const SEASONS = {
  winter: ['❄', '❅', '❆'],
  spring: ['🌸', '🌺', '🌼'],
  summer: ['☀️', '✨'],
  autumn: ['🍂', '🍁']
};
function seasonForMonth(m){ // m: 0=Jan .. 11=Dec
  if (m === 11 || m <= 1) return 'winter';
  if (m <= 4) return 'spring';
  if (m <= 7) return 'summer';
  return 'autumn';
}
function spawnSeasonalBurst(){
  const ukMonth = parseInt(new Date().toLocaleString('en-GB', {month:'numeric', timeZone:'Europe/London'}), 10) - 1;
  const glyphs = SEASONS[seasonForMonth(ukMonth)];
  const layer = document.getElementById('seasonalLayer');
  for (let i = 0; i < 22; i++){
    const el = document.createElement('span');
    el.className = 'particle';
    el.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
    const dur = 8 + Math.random() * 6;
    const delay = Math.random() * 5;
    el.style.left = (Math.random() * 100) + 'vw';
    el.style.fontSize = (1.1 + Math.random() * 1.3) + 'vw';
    el.style.setProperty('--dx1', (Math.random() * 10 - 5).toFixed(1) + 'vw');
    el.style.setProperty('--dx2', (Math.random() * 10 - 5).toFixed(1) + 'vw');
    el.style.animationDuration = dur + 's';
    el.style.animationDelay = delay + 's';
    layer.appendChild(el);
    setTimeout(() => el.remove(), (dur + delay) * 1000 + 500);
  }
}
spawnSeasonalBurst(); // fire once on load so the effect is visible straight away
let seasonalLastHour = new Date().getHours();
setInterval(() => {
  const now = new Date();
  if (now.getMinutes() === 0 && now.getHours() !== seasonalLastHour){
    seasonalLastHour = now.getHours();
    spawnSeasonalBurst();
  }
}, 30000);

// Gentle auto-scroll for any panel whose content overflows (TV has no mouse)
document.querySelectorAll('.scroll:not(.no-autoscroll)').forEach(box => {
  const inner = box.querySelector('.scroll-inner');
  let pos = 0, dir = 1, pause = 175;
  setInterval(() => {
    const max = inner.scrollHeight - box.clientHeight;
    if (max <= 4) { inner.style.transform = ''; return; }
    if (pause > 0) { pause--; return; }
    pos += dir * 0.8;
    if (pos >= max) { pos = max; dir = -1; pause = 175; }
    if (pos <= 0) { pos = 0; dir = 1; pause = 175; }
    inner.style.transform = `translateY(${-pos}px)`;
  }, 40);
});
</script>
